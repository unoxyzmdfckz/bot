<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Color Bet Arena</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { margin:0; padding:0; background:#0a0a1a; color:#fff; font-family:Arial; text-align:center; }
    h1 { color:#ff6b6b; margin:15px; font-size:1.5em; }
    button { padding:12px 20px; margin:5px; border:none; border-radius:12px; background:#1e90ff; color:white; font-size:1em; cursor:pointer; }
    .color-btn { width:70px; height:70px; border-radius:50%; display:inline-block; margin:10px; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.5); }
    .red { background:#e74c3c; }
    .blue { background:#3498db; }
    .green { background:#2ecc71; }
    .yellow { background:#f1c40f; }
    .purple { background:#9b59b6; }
    #status { padding:15px; background:#1a1a2e; margin:15px; border-radius:12px; font-size:0.9em; }
    #timer { font-size:2.2em; color:#ff4757; margin:10px; }
    #pot { font-size:1.3em; font-weight:bold; color:#ffd700; }
    #bets { margin:10px; }
    .bet { background:#16213e; padding:8px; margin:3px; border-radius:8px; font-size:0.9em; }
    .win-announce { background:#2ed573; color:#000; padding:12px; border-radius:12px; margin:10px; font-weight:bold; }
    .lose { background:#ff4757; color:#fff; }
    .winner-glow { animation: glow 1s infinite; }
    @keyframes glow { 0%,100% { box-shadow:0 0 15px #ffd700; } 50% { box-shadow:0 0 30px #ff6b6b; } }
  </style>
</head>
<body>
  <h1>Color Bet Arena</h1>

  <div id="lobby">
    <button id="joinBtn">JOIN ROUND</button>
    <button id="balanceBtn">Balance</button>
  </div>

  <div id="game" style="display:none;">
    <div id="status">Loading…</div>
    <div id="timer">--</div>
    <div id="pot">Pot: 0</div>
    <div id="betInput">
      <input type="number" id="amount" placeholder="Min 100" min="100"
             style="padding:10px; width:130px; margin:8px; border-radius:8px; border:none;" />
      <div>
        <div class="color-btn red"   data-color="red"></div>
        <div class="color-btn blue"  data-color="blue"></div>
        <div class="color-btn green" data-color="green"></div>
        <div class="color-btn yellow"data-color="yellow"></div>
        <div class="color-btn purple"data-color="purple"></div>
      </div>
    </div>
    <div id="myBet"></div>
    <div id="bets"></div>
  </div>

  <div id="result" style="display:none;"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();

    const user    = tg.initDataUnsafe.user;
    const chatId  = tg.initDataUnsafe.chat?.id || 'private';
    const userId  = user.id.toString();
    const username = user.username ? `@${user.username}` : (user.first_name || 'Player');

    const COLORS = ['red','blue','green','yellow','purple'];
    const COLOR_NAME = {red:'Red',blue:'Blue',green:'Green',yellow:'Yellow',purple:'Purple'};
    const COLOR_HEX  = {red:'#e74c3c',blue:'#3498db',green:'#2ecc71',yellow:'#f1c40f',purple:'#9b59b6'};

    const GAME_KEY    = `cba_game_${chatId}`;
    const PROFILE_KEY = `cba_profile_${userId}`;

    let game = null;
    let profile = {balance:10000, wins:0, totalBet:0, net:0};
    let pollInterval = null;
    let timerInterval = null;

    /* --------------------------------------------------------------
       LOAD / SAVE
    -------------------------------------------------------------- */
    async function loadData() {
      try {
        const [g,p] = await Promise.all([
          tg.CloudStorage.getItem(GAME_KEY),
          tg.CloudStorage.getItem(PROFILE_KEY)
        ]);

        game = g ? JSON.parse(g) : {
          round:0, players:[], bets:{}, pot:0, status:'waiting',
          winner:null, endTime:0, winners:[], payouts:{}
        };

        if (p) profile = JSON.parse(p);
        else   profile = {balance:10000, wins:0, totalBet:0, net:0};

        // first load finished → attach handlers
        if (!document.getElementById('joinBtn').onclick) attachHandlers();

        updateUI();
      } catch(e){ console.error(e); }
    }

    function saveGame()    { tg.CloudStorage.setItem(GAME_KEY, JSON.stringify(game)); }
    function saveProfile() { tg.CloudStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); }

    /* --------------------------------------------------------------
       UI
    -------------------------------------------------------------- */
    function updateUI() {
      if (!game) return;

      const now = Date.now();
      const left = game.endTime ? Math.max(0, Math.ceil((game.endTime - now)/1000)) : 0;

      // lobby / game
      document.getElementById('lobby').style.display = game.status === 'waiting' ? 'block' : 'none';
      document.getElementById('game').style.display  = game.status !== 'waiting' ? 'block' : 'none';

      if (game.status === 'waiting') {
        document.getElementById('status').innerHTML = '<b>Next round starts when someone joins!</b>';
        return;
      }

      if (game.status === 'betting') {
        document.getElementById('timer').textContent = left;
        document.getElementById('pot').textContent   = `Pot: ${game.pot.toLocaleString()}`;
        document.getElementById('status').innerHTML = `
          <b>Round ${game.round}</b><br>
          Players: ${game.players.length}/12 | Time left: ${left}s
        `;
        renderBets(); renderMyBet();
      }

      if (game.status === 'spinning') {
        document.getElementById('status').innerHTML = '<h2>SPINNING...</h2>';
        document.getElementById('timer').textContent = '';
        document.getElementById('betInput').style.display = 'none';
      }

      if (game.status === 'finished') showResult();

      // auto-end betting
      if (left <= 0 && game.status === 'betting') endBetting();
    }

    function renderBets() {
      const div = document.getElementById('bets');
      let html = '<b>Live Bets:</b><br>';
      COLORS.forEach(c => {
        const total = Object.values(game.bets).filter(b=>b.color===c).reduce((s,b)=>s+b.amount,0);
        if (total>0) {
          html += `<div class="bet">
            <span style="color:${COLOR_HEX[c]}">${COLOR_NAME[c]}</span>:
            ${total.toLocaleString()} (${Object.values(game.bets).filter(b=>b.color===c).length} bets)
          </div>`;
        }
      });
      div.innerHTML = html;
    }

    function renderMyBet() {
      const div = document.getElementById('myBet');
      if (game.bets[userId]) {
        const b = game.bets[userId];
        div.innerHTML = `<div class="win-announce">
          Your bet: ${b.amount.toLocaleString()} on <b style="color:${COLOR_HEX[b.color]}">${COLOR_NAME[b.color]}</b>
        </div>`;
        document.getElementById('betInput').style.display = 'none';
      } else {
        div.innerHTML = '';
        document.getElementById('betInput').style.display = 'block';
      }
    }

    /* --------------------------------------------------------------
       HANDLERS (attached only after first load)
    -------------------------------------------------------------- */
    function attachHandlers() {
      // JOIN
      document.getElementById('joinBtn').onclick = () => {
        if (!game) return;
        if (game.status !== 'waiting') return tg.showAlert('Round already in progress!');
        if (game.players.includes(userId)) return tg.showAlert('You already joined!');

        game.players.push(userId);
        game.status = 'betting';
        game.endTime = Date.now() + 40000;   // 40 s betting
        game.round++;
        saveGame();
        updateUI();
        startPolling();
      };

      // BET
      document.querySelectorAll('.color-btn').forEach(btn => {
        btn.onclick = () => {
          if (!game) return;
          if (game.status !== 'betting') return tg.showAlert('Betting closed!');
          if (!game.players.includes(userId)) return tg.showAlert('Join first!');
          if (game.bets[userId]) return tg.showAlert('You already bet!');

          const amount = parseInt(document.getElementById('amount').value);
          if (!amount || amount < 100 || amount > profile.balance)
            return tg.showAlert('Invalid amount! (min 100, max balance)');

          const color = btn.dataset.color;
          game.bets[userId] = {userId, username, color, amount};
          game.pot += amount;
          profile.balance -= amount;
          profile.totalBet = (profile.totalBet||0) + amount;
          saveGame(); saveProfile();
          tg.showAlert(`Bet ${amount.toLocaleString()} on ${COLOR_NAME[color]}!`);
          updateUI();
        };
      });

      // BALANCE
      document.getElementById('balanceBtn').onclick = () => {
        tg.showAlert(`Balance: ${profile.balance.toLocaleString()} coins\nWins: ${profile.wins}`);
      };
    }

    /* --------------------------------------------------------------
       END BETTING → SPIN → RESULT
    -------------------------------------------------------------- */
    function endBetting() {
      game.status = 'spinning';
      saveGame(); updateUI();

      setTimeout(() => {
        const winnerColor = COLORS[Math.floor(Math.random()*COLORS.length)];
        game.winner = winnerColor;

        const winning = Object.values(game.bets).filter(b=>b.color===winnerColor);
        game.winners = []; game.payouts = {};

        if (winning.length>0) {
          const totalWin = winning.reduce((s,b)=>s+b.amount,0);
          const mult = Math.floor(game.pot / totalWin);

          winning.forEach(b => {
            const payout = b.amount * mult;
            game.winners.push(b.username);
            game.payouts[b.userId] = payout;

            // update winner profile
            tg.CloudStorage.getItem(`cba_profile_${b.userId}`, (e,d) => {
              const p = d ? JSON.parse(d) : {balance:10000, wins:0};
              p.balance = (p.balance||0) + payout - b.amount;
              p.wins = (p.wins||0) + 1;
              tg.CloudStorage.setItem(`cba_profile_${b.userId}`, JSON.stringify(p));
            });
          });
        }

        game.status = 'finished';
        saveGame(); updateUI();
      }, 2500);
    }

    function showResult() {
      document.getElementById('game').style.display = 'none';
      document.getElementById('result').style.display = 'block';

      const myBet = game.bets[userId];
      const iWon = myBet && myBet.color === game.winner;
      const myPayout = game.payouts[userId]||0;

      let winnersHtml = '';
      game.winners.forEach(w => {
        const payout = Object.values(game.payouts).find((_,i)=>game.winners[i]===w)||0;
        winnersHtml += `<div class="win-announce winner-glow">
          Winner: ${w} → +${payout.toLocaleString()} coins
        </div>`;
      });

      document.getElementById('result').innerHTML = `
        <h2 class="winner-glow">Round ${game.round} Over!</h2>
        <div class="color-btn ${game.winner}" style="width:100px;height:100px;margin:20px auto;"></div>
        <h3 style="color:${COLOR_HEX[game.winner]}">WIN: ${COLOR_NAME[game.winner]}</h3>
        <p>Pot: ${game.pot.toLocaleString()} coins</p>
        ${winnersHtml||'<p>No winners</p>'}
        ${iWon ? `<div class="win-announce">YOU WON +${myPayout.toLocaleString()}!</div>` : ''}
        ${myBet && !iWon ? `<div class="win-announce lose">Lost ${myBet.amount.toLocaleString()}</div>` : ''}
        <br><button onclick="location.reload()">Next Round</button>
      `;

      setTimeout(resetGame, 12000);
    }

    function resetGame() {
      game = {round:game.round, players:[], bets:{}, pot:0, status:'waiting',
              winner:null, endTime:0, winners:[], payouts:{}};
      saveGame(); location.reload();
    }

    /* --------------------------------------------------------------
       POLLING
    -------------------------------------------------------------- */
    function startPolling() {
      clearInterval(pollInterval);
      pollInterval = setInterval(loadData, 1800);
    }

    /* --------------------------------------------------------------
       INIT
    -------------------------------------------------------------- */
    loadData();                       // first load → attaches handlers
    setInterval(() => { if (game && game.status==='betting') updateUI(); }, 1000);

    tg.MainButton.text = "Invite Friends";
    tg.MainButton.show();
    tg.MainButton.onClick(() => tg.openTelegramLink(`https://t.me/${tg.initDataUnsafe.bot_username}?startgroup=true`));
  </script>
</body>
</html>

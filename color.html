<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Color Bet Arena</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { margin:0; padding:0; background:#0a0a1a; color:#fff; font-family:Arial; text-align:center; }
    h1 { color:#ff6b6b; margin:15px; }
    button { padding:12px 20px; margin:5px; border:none; border-radius:12px; background:#1e90ff; color:white; font-size:1em; cursor:pointer; }
    .color-btn { width:70px; height:70px; border-radius:50%; display:inline-block; margin:10px; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.5); }
    .red { background:#e74c3c; }
    .blue { background:#3498db; }
    .green { background:#2ecc71; }
    .yellow { background:#f1c40f; }
    .purple { background:#9b59b6; }
    #status { padding:15px; background:#1a1a2e; margin:15px; border-radius:12px; }
    #bets { font-size:0.9em; margin:10px; }
    .bet { background:#16213e; padding:8px; margin:3px; border-radius:8px; }
    #pot { font-size:1.3em; font-weight:bold; color:#ffd700; }
    #timer { font-size:2em; color:#ff4757; }
    .winner { animation: glow 1s infinite; }
    @keyframes glow { 0%,100% { box-shadow:0 0 15px #ffd700; } 50% { box-shadow:0 0 30px #ff6b6b; } }
  </style>
</head>
<body>
  <h1>🎰 Color Bet Arena</h1>
  <div id="lobby">
    <button id="joinBtn">/join</button>
    <button id="balanceBtn">Balance</button>
    <button id="topBtn">Top Players</button>
  </div>

  <div id="game" style="display:none;">
    <div id="status"></div>
    <div id="timer">30</div>
    <div id="pot">Pot: 0 coins</div>
    <div id="betAmount">
      <input type="number" id="amount" placeholder="Amount" min="100" style="padding:10px; width:120px; margin:10px; border-radius:8px; border:none;" />
      <div>
        <div class="color-btn red" data-color="red"></div>
        <div class="color-btn blue" data-color="blue"></div>
        <div class="color-btn green" data-color="green"></div>
        <div class="color-btn yellow" data-color="yellow"></div>
        <div class="color-btn purple" data-color="purple"></div>
      </div>
    </div>
    <div id="bets"></div>
  </div>

  <div id="result" style="display:none;"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();
    const user = tg.initDataUnsafe.user;
    const chatId = tg.initDataUnsafe.chat?.id || 'private';
    const userId = user.id;
    const userName = user.first_name || 'Player';

    const COLORS = ['red', 'blue', 'green', 'yellow', 'purple'];
    const COLOR_MAP = { red:'#e74c3c', blue:'#3498db', green:'#2ecc71', yellow:'#f1c40f', purple:'#9b59b6' };
    const STORAGE = `cba_${chatId}`;
    const PROFILE = `profile_${userId}`;

    let game = {}, profile = {}, timer, poll;

    // Load
    function load() {
      tg.CloudStorage.getItem(STORAGE, (err, data) => {
        game = data ? JSON.parse(data) : { round: 0, players: [], bets: {}, pot: 0, status: 'waiting', winner: null, endTime: 0 };
        update();
      });
      tg.CloudStorage.getItem(PROFILE, (err, data) => {
        profile = data ? JSON.parse(data) : { balance: 10000, wins: 0, bets: 0 };
        document.getElementById('balanceBtn').textContent = `Balance: ${profile.balance}`;
      });
    }

    function save() {
      tg.CloudStorage.setItem(STORAGE, JSON.stringify(game));
      tg.CloudStorage.setItem(PROFILE, JSON.stringify(profile));
    }

    // UI
    function update() {
      const now = Date.now();
      const timeLeft = game.endTime ? Math.max(0, Math.floor((game.endTime - now)/1000)) : 0;

      if (game.status === 'finished') {
        showResult();
        return;
      }

      document.getElementById('lobby').style.display = game.status === 'waiting' ? 'block' : 'none';
      document.getElementById('game').style.display = game.status !== 'waiting' ? 'block' : 'none';

      if (game.status === 'betting') {
        document.getElementById('timer').textContent = timeLeft;
        document.getElementById('pot').textContent = `Pot: ${game.pot} coins`;
        document.getElementById('status').innerHTML = `<b>Round ${game.round}</b> - Betting open!<br>Players: ${game.players.length}/10`;
        renderBets();
      }

      if (timeLeft === 0 && game.status === 'betting') {
        endBetting();
      }
    }

    function renderBets() {
      const betsDiv = document.getElementById('bets');
      betsDiv.innerHTML = '<b>Bets:</b><br>';
      COLORS.forEach(c => {
        const total = Object.values(game.bets).filter(b => b.color === c).reduce((a,b) => a + b.amount, 0);
        if (total > 0) {
          const count = Object.values(game.bets).filter(b => b.color === c).length;
          betsDiv.innerHTML += `<div class="bet"><b style="color:${COLOR_MAP[c]}">${c.toUpperCase()}</b>: ${total} (${count} bets)</div>`;
        }
      });
    }

    // Join
    document.getElementById('joinBtn').onclick = () => {
      if (game.status !== 'waiting') return alert("Round in progress!");
      if (game.players.includes(userId)) return alert("Already joined!");

      game.players.push(userId);
      game.status = 'betting';
      game.endTime = Date.now() + 30000; // 30 sec
      game.round++;
      save();
      update();
      startPoll();
    };

    // Bet
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.onclick = () => {
        if (game.status !== 'betting') return;
        if (!game.players.includes(userId)) return alert("Join first!");

        const amount = parseInt(document.getElementById('amount').value);
        if (!amount || amount < 100 || amount > profile.balance) return alert("Invalid amount!");

        const color = btn.dataset.color;
        if (game.bets[userId]) return alert("Already bet!");

        game.bets[userId] = { name: userName, color, amount };
        game.pot += amount;
        profile.balance -= amount;
        profile.bets++;
        save();
        alert(`Bet ${amount} on ${color}!`);
        update();
      };
    });

    // End Betting
    function endBetting() {
      game.status = 'spinning';
      save();

      setTimeout(() => {
        const winner = COLORS[Math.floor(Math.random() * COLORS.length)];
        game.winner = winner;
        game.status = 'finished';

        const winningBets = Object.values(game.bets).filter(b => b.color === winner);
        const totalWin = winningBets.reduce((a,b) => a + b.amount, 0);
        const pot = game.pot;

        if (totalWin > 0) {
          const payout = Math.floor(pot / totalWin); // multiplier
          winningBets.forEach(b => {
            const userP = getProfileSync(b.name); // simplified
            if (userP) {
              userP.balance += b.amount * payout;
              userP.wins++;
            }
          });
        }

        // Reset for next
        setTimeout(() => {
          game = { round: game.round, players: [], bets: {}, pot: 0, status: 'waiting', winner: null, endTime: 0 };
          save();
          load();
        }, 8000);

        save();
        update();
      }, 3000);
    }

    function showResult() {
      document.getElementById('game').style.display = 'none';
      document.getElementById('result').style.display = 'block';
      const won = game.bets[userId]?.color === game.winner;
      const earnings = won ? game.bets[userId].amount * (game.pot / Object.values(game.bets).filter(b => b.color === game.winner).reduce((a,b) => a + b.amount, 0)) : 0;

      document.getElementById('result').innerHTML = `
        <h2 class="${won ? 'winner' : ''}">🎉 Round ${game.round} Result!</h2>
        <div class="color-btn ${game.winner}" style="width:100px;height:100px;margin:20px auto;"></div>
        <p>Winning Color: <b style="color:${COLOR_MAP[game.winner]}">${game.winner.toUpperCase()}</b></p>
        <p>Pot: <b>${game.pot}</b> coins</p>
        ${won ? `<p style="color:#2ed573">You WON +${Math.floor(earnings)}!</p>` : `<p style="color:#ff6b6b">You lost ${game.bets[userId]?.amount || 0}</p>`}
        <button onclick="document.getElementById('result').style.display='none'; document.getElementById('lobby').style.display='block';">Back</button>
      `;
    }

    // Top
    document.getElementById('topBtn').onclick = () => {
      let tops = [];
      // Simplified: scan all profiles (in real use, keep a leaderboard key)
      alert("Top players coming soon!");
    };

    // Poll
    function startPoll() {
      clearInterval(poll);
      poll = setInterval(load, 2000);
    }

    // Init
    load();
    tg.MainButton.text = "Share Game";
    tg.MainButton.show();
    tg.MainButton.onClick(() => tg.openTelegramLink(`https://t.me/${tg.initDataUnsafe.bot_username}?startgroup=true`));

    // Helper
    function getProfileSync(name) { return profile; } // placeholder
  </script>
</body>
</html>
